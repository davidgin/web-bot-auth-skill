name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 (current ubuntu-latest).
          - python: "3.9"
            os: ubuntu-24.04
        exclude:
          - python: "3.9"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest -v test_web_bot_auth
        working-directory: web-bot-auth/scripts
      - run: uv run python scripts/check_size.py
        if: matrix.python == '3.13'
      - run: uv run python -m unittest -v test_check_size
        working-directory: scripts
        if: matrix.python == '3.13'
