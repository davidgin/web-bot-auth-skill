name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 (current ubuntu-latest).
          - python: "3.9"
            os: ubuntu-24.04
        exclude:
          - python: "3.9"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cryptography
      - run: python -m unittest -v test_web_bot_auth
        working-directory: web-bot-auth/scripts
